services:
  juiceshop:
    image: bkimminich/juice-shop:latest
    ports:
      - "3000:3000"
    networks:
      - shield-net
    restart: unless-stopped

  sentinel-shield:
    build: .
    ports:
      - "8080:8080"
    command: >
      proxy --upstream http://juiceshop:3000 --host 0.0.0.0 --port 8080
    volumes:
      - ./sentinel-shield.yml:/app/sentinel-shield.yml:ro
      - ./sentinel_shield/detection/rules:/app/sentinel_shield/detection/rules:ro
    depends_on:
      - juiceshop
    networks:
      - shield-net
    restart: unless-stopped

networks:
  shield-net:
    driver: bridge
