attack_type: ssrf
description: "Server-Side Request Forgery detection patterns"
severity: high

rules:
  - id: SSRF-001
    name: "Internal IP Access"
    severity: critical
    severity_weight: 1.0
    confidence: 0.95
    locations: [query, body, headers, cookies]
    patterns:
      - "https?://127\\.0\\.0\\.1"
      - "https?://localhost"
      - "https?://0\\.0\\.0\\.0"
      - "https?://10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}"
      - "https?://172\\.(1[6-9]|2\\d|3[01])\\.\\d{1,3}\\.\\d{1,3}"
      - "https?://192\\.168\\.\\d{1,3}\\.\\d{1,3}"
      - "https?://169\\.254\\.\\d{1,3}\\.\\d{1,3}"
      - "https?://[::1]"
      - "https?://[0:0:0:0:0:0:0:1]"
    action: block

  - id: SSRF-002
    name: "Cloud Metadata Endpoints"
    severity: critical
    severity_weight: 1.0
    confidence: 0.95
    locations: [query, body, cookies]
    patterns:
      - "169\\.254\\.169\\.254"
      - "metadata\\.google\\.internal"
      - "metadata\\.google\\.com"
      - "100\\.100\\.100\\.200"
      - "instance-data\\."
      - "instance-metadata\\."
    action: block

  - id: SSRF-003
    name: "Internal Service Discovery"
    severity: high
    severity_weight: 0.8
    confidence: 0.85
    locations: [query, body, cookies]
    patterns:
      - "https?://.*\\.internal\\."
      - "https?://.*\\.local\\."
      - "https?://consul\\."
      - "https?://vault\\."
      - "https?://etcd\\."
      - "https?://kubernetes\\.default"
      - "https?://kubernetes\\.svc"
    action: block

  - id: SSRF-004
    name: "Private IP Obfuscation"
    severity: high
    severity_weight: 0.8
    confidence: 0.8
    locations: [query, body, cookies]
    patterns:
      - "https?://0x7f000001"
      - "https?://0x0a000001"
      - "https?://0xac1[0-f]{3}"
      - "https?://0xc0a8[0-f]{2}"
      - "https?://0177\\.0\\.0\\.1"
      - "https?://2130706433"
      - "https?://3232235521"
      - "https?://[0-9a-f]{1,4}\\.[0-9a-f]{1,4}\\.[0-9a-f]{1,4}\\.[0-9a-f]{1,4}"
    action: block

  - id: SSRF-005
    name: "DNS Rebinding Vectors"
    severity: medium
    severity_weight: 0.6
    confidence: 0.7
    locations: [query, body]
    patterns:
      - "https?://[\\d]+\\.xip\\.io"
      - "https?://[\\d]+\\.nip\\.io"
      - "https?://[\\d]+\\.sslip\\.io"
      - "https?://localtest\\.me"
      - "https?://customer\\.app\\.loca\\.lt"
    action: block
